<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Images → JPEG 400 px < 150 Ko</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb;
  }
  main { width: min(720px, 92vw); padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  #drop {
    border: 2px dashed #4b5563; border-radius: 16px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: .2s;
  }
  #drop.over { border-color: #22d3ee; background: #0e749022; }
  #results { margin-top: 18px; display: grid; gap: 14px; }
  .card {
    background: #1f2937; border-radius: 14px; padding: 14px;
  }
  img {
    max-width: 100%; max-height: 260px;
    border-radius: 10px; display: block;
  }
  p { margin: 8px 0; }
  .ok { color: #34d399; } .err { color: #f87171; }
  small { color: #9ca3af; }
</style>
</head>
<body>
<main>
  <h1>Images → JPEG 400 px de large, moins de 150 Ko</h1>

  <div id="drop">
    <strong>Dépose une ou plusieurs images ici</strong><br>
    ou clique pour choisir des fichiers<br>
    <small>Traitement local — aucune image n’est envoyée sur Internet</small>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </div>

  <div id="results"></div>
</main>

<script>
const MAX_WIDTH = 400;       // Largeur finale exacte
const MAX_SIZE = 150 * 1024; // 150 Ko
const START_QUALITY = 0.90;  // Qualité JPEG de départ

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const results = document.getElementById('results');

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  [...e.target.files].forEach(convert);
});

['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => {
    e.preventDefault();
    drop.classList.add('over');
  })
);

['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => {
    e.preventDefault();
    drop.classList.remove('over');
  })
);

drop.addEventListener('drop', e => {
  [...e.dataTransfer.files].forEach(convert);
});

function toJpeg(canvas, quality) {
  return new Promise(resolve =>
    canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality)
  );
}

function resizeTo400(bitmap, scale = 1) {
  const width = MAX_WIDTH * scale;
  const ratio = bitmap.height / bitmap.width;
  const height = Math.max(1, Math.round(width * ratio));

  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(width));
  canvas.height = height;

  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

  return canvas;
}

async function convert(file) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<p>Conversion de « ${file.name} »…</p>`;
  results.appendChild(card);

  const status = card.querySelector('p');

  try {
    const bitmap = await createImageBitmap(file);

    // 1) Essai à 400 px de large avec différentes qualités JPEG
    let best = null;
    let low = 0.05;
    let high = START_QUALITY;

    for (let i = 0; i < 12; i++) {
      const quality = (low + high) / 2;
      const canvas = resizeTo400(bitmap, 1);
      const blob = await toJpeg(canvas, quality);

      if (blob.size <= MAX_SIZE) {
        best = blob;
        low = quality;
      } else {
        high = quality;
      }
    }

    // 2) Si toujours trop lourd, on réduit la hauteur en gardant 400 px de large
    if (!best) {
      let lowScale = 0.20;
      let highScale = 1;

      for (let i = 0; i < 14; i++) {
        const scale = (lowScale + highScale) / 2;
        const canvas = resizeTo400(bitmap, scale);
        const blob = await toJpeg(canvas, 0.80);

        if (blob.size <= MAX_SIZE) {
          best = blob;
          lowScale = scale;
        } else {
          highScale = scale;
        }
      }
    }

    if (!best) {
      throw new Error('Impossible d’atteindre 150 Ko même en réduisant l’image.');
    }

    const url = URL.createObjectURL(best);
    const fileName = file.name.replace(/\.[^.]+$/, '') + '-400px-150ko.jpg';

    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Aperçu converti';
    card.appendChild(img);

    // Téléchargement automatique
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();

    status.className = 'ok';
    status.textContent =
      `« ${file.name} » : 400 px de large, ${(best.size / 1024).toFixed(1)} Ko — téléchargement lancé.`;
  } catch (err) {
    status.className = 'err';
    status.textContent = `Erreur pour « ${file.name} » : ${err.message}`;
  }
}
</script>
</body>
</html>
