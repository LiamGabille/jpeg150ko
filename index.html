<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Images → JPEG < 150 Ko</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb;
  }
  main { width: min(720px, 92vw); padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  #drop {
    border: 2px dashed #4b5563; border-radius: 16px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: .2s;
  }
  #drop.over { border-color: #22d3ee; background: #0e749022; }
  #results { margin-top: 18px; display: grid; gap: 14px; }
  .card {
    background: #1f2937; border-radius: 14px; padding: 14px;
  }
  img { max-width: 100%; max-height: 260px; border-radius: 10px; display: block; }
  p { margin: 8px 0; }
  .ok { color: #34d399; } .err { color: #f87171; }
  small { color: #9ca3af; }
</style>
</head>
<body>
<main>
  <h1>Images → JPEG de moins de 150 Ko</h1>

  <div id="drop">
    <strong>Dépose une ou plusieurs images ici</strong><br>
    ou clique pour choisir des fichiers<br>
    <small>JPG, PNG, WebP… — traitement local, aucune image envoyée sur Internet</small>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </div>

  <div id="results"></div>
</main>

<script>
const MAX = 150 * 1024; // 150 Ko
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const results = document.getElementById('results');

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  [...e.target.files].forEach(convert);
});

['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); })
);
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); })
);
drop.addEventListener('drop', e => {
  [...e.dataTransfer.files].forEach(convert);
});

function toJpeg(canvas, quality) {
  return new Promise(resolve =>
    canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality)
  );
}

const MAX_WIDTH = 400; // Largeur maximale en pixels

function resizeToCanvas(bitmap, scale = 1) {
  // Ratio d'origine conservé
  const ratio = bitmap.height / bitmap.width;

  // Largeur finale : 400 px maximum, puis réduction si nécessaire
  let width = Math.min(bitmap.width, MAX_WIDTH) * scale;
  let height = width * ratio;

  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(width));
  canvas.height = Math.max(1, Math.round(height));

  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

  return canvas;
};
}

async function convert(file) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<p>Conversion de « ${file.name} »…</p>`;
  results.appendChild(card);

  const status = card.querySelector('p');

  try {
    const bitmap = await createImageBitmap(file);

    // 1) On cherche la meilleure qualité JPEG à taille d'origine
    let best = null;
    let low = 0.05, high = 0.95;

    for (let i = 0; i < 12; i++) {
      const quality = (low + high) / 2;
      const canvas = resizeToCanvas(bitmap, 1);
      const blob = await toJpeg(canvas, quality);

      if (blob.size <= MAX) {
        best = blob;
        low = quality;
      } else {
        high = quality;
      }
    }

    // 2) Si ce n'est toujours pas assez léger, on réduit la résolution
    if (!best) {
      let lowScale = 0.15, highScale = 1;

      for (let i = 0; i < 14; i++) {
        const scale = (lowScale + highScale) / 2;
        const canvas = resizeToCanvas(bitmap, scale);
        const blob = await toJpeg(canvas, 0.82);

        if (blob.size <= MAX) {
          best = blob;
          lowScale = scale;
        } else {
          highScale = scale;
        }
      }
    }

    if (!best) throw new Error('Impossible d’atteindre 150 Ko.');

    const url = URL.createObjectURL(best);
    const fileName = file.name.replace(/\.[^.]+$/, '') + '-150ko.jpg';

    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Aperçu';
    card.appendChild(img);

    // Téléchargement automatique
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();

    status.className = 'ok';
    status.textContent = `« ${file.name} » : ${(best.size / 1024).toFixed(1)} Ko — téléchargement lancé.`;
  } catch (err) {
    status.className = 'err';
    status.textContent = `Erreur pour « ${file.name} » : ${err.message}`;
  }
}
</script>
</body>
</html>
