<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertir en JPEG < 150 Ko</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb;
  }
  main { width: min(680px, 92vw); padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  #drop {
    border: 2px dashed #4b5563; border-radius: 16px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: .2s;
  }
  #drop.over { border-color: #22d3ee; background: #0e749022; }
  button {
    margin-top: 14px; padding: 10px 16px; border: 0; border-radius: 10px;
    background: #22d3ee; color: #06202a; font-weight: 700; cursor: pointer;
  }
  #result { margin-top: 18px; display: none; }
  img { max-width: 100%; border-radius: 12px; display: block; margin-top: 12px; }
  p { margin: 8px 0; }
  .ok { color: #34d399; } .err { color: #f87171; }
</style>
</head>
<body>
<main>
  <h1>Image → JPEG de moins de 150 Ko</h1>

  <div id="drop">
    <strong>Dépose une image ici</strong><br>
    ou clique pour choisir un fichier<br>
    <small>JPG, PNG, WebP… — traitement local dans ton navigateur</small>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <div id="result">
    <p id="info"></p>
    <img id="preview" alt="Aperçu">
    <a id="download"><button>Télécharger le JPEG</button></a>
  </div>
</main>

<script>
const MAX = 150 * 1024; // 150 Ko
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const result = document.getElementById('result');
const info = document.getElementById('info');
const preview = document.getElementById('preview');
const download = document.getElementById('download');

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) compress(e.target.files[0]);
});

['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); })
);
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); })
);
drop.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) compress(file);
});

function toJpeg(bitmap, quality) {
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0);

  return new Promise(resolve =>
    canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality)
  );
}

async function compress(file) {
  try {
    info.className = '';
    info.textContent = 'Conversion en cours…';
    result.style.display = 'block';

    const bitmap = await createImageBitmap(file);

    // Recherche de la meilleure qualité possible sous 150 Ko
    let low = 0.05, high = 0.95, best = null;

    for (let i = 0; i < 12; i++) {
      const mid = (low + high) / 2;
      const blob = await toJpeg(bitmap, mid);

      if (blob.size <= MAX) {
        best = blob;
        low = mid;
      } else {
        high = mid;
      }
    }

    if (!best) {
      // Si même une qualité très basse dépasse 150 Ko,
      // on réduit progressivement les dimensions.
      let scale = 0.9;
      while (scale > 0.15 && !best) {
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext('2d').drawImage(
          bitmap, 0, 0, canvas.width, canvas.height
        );

        best = await new Promise(resolve =>
          canvas.toBlob(b => resolve(b), 'image/jpeg', 0.72)
        );

        if (best.size > MAX) best = null;
        scale -= 0.1;
      }
    }

    if (!best) throw new Error('Impossible d’atteindre 150 Ko.');

    const url = URL.createObjectURL(best);
    preview.src = url;
    download.href = url;
    download.download = file.name.replace(/\.[^.]+$/, '') + '-150ko.jpg';

    info.className = 'ok';
    info.textContent = `Prêt : ${(best.size / 1024).toFixed(1)} Ko — ` +
      `qualité JPEG optimisée automatiquement.`;
  } catch (err) {
    info.className = 'err';
    info.textContent = 'Erreur : ' + err.message;
  }
}
</script>
</body>
</html>
